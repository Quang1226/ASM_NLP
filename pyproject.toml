[project]
name = "intent-aware-customer-support"
version = "0.1.0"
description = "Reproducible NLP intent classification course project"
requires-python = ">=3.11"
dependencies = [
  "scikit-learn==1.8.0",
  "nltk==3.10.4",
  "joblib==1.5.3",
  "sentence-transformers==6.1.0",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
