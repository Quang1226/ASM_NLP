[project]
name = "intent-aware-customer-support"
version = "0.1.0"
description = "Reproducible NLP intent classification course project"
requires-python = ">=3.11"
dependencies = [
  "scikit-learn==1.8.0",
  "nltk==3.10.4",
  "joblib==1.5.3",
  "sentence-transformers==6.1.0",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "certifi==2026.10.23",
  "torch==2.11.0",
  "transformers==5.17.0",
  "huggingface-hub==1.32.0",
  "numpy==2.2.2",
  "scipy==1.17.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
